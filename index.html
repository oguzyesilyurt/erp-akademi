<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ERP Akademi</title>
  <meta name="description" content="SAP ve CRM süreçlerini uygulamalı öğreten eğitim simülatörü.">
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ERP Akademi">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/company.css">
  <link rel="stylesheet" href="css/learn.css">
  <link rel="stylesheet" href="css/workflow.css">
  <link rel="stylesheet" href="css/docs.css">
  <link rel="stylesheet" href="css/testlab.css">
  <link rel="stylesheet" href="css/c4c.css">
  <link rel="stylesheet" href="css/mm.css">
  <link rel="stylesheet" href="css/fi.css">
  <script>
    // Tema, ilk boyamadan önce uygulanır (yanıp sönmeyi önler)
    (function () {
      try {
        var t = localStorage.getItem('erp-akademi:theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Ana menü">
      <a class="brand" href="#/">
        <img src="icons/icon.svg" alt="" width="32" height="32">
        <span class="brand-text">ERP Akademi</span>
      </a>
      <nav class="nav" id="nav-side"></nav>
      <div class="sidebar-foot">
        <button class="nav-item theme-toggle" type="button" data-action="theme">
          <span class="nav-icon" data-theme-icon></span>
          <span class="nav-label" data-theme-label>Tema</span>
        </button>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <header class="topbar" id="topbar">
        <a class="topbar-brand" href="#/" aria-label="ERP Akademi ana sayfa"><img src="icons/icon.svg" alt="" width="28" height="28"></a>
        <span class="topbar-spacer"></span>
        <a class="release-chip" id="release-chip" href="#/track/testing/simulation" hidden></a>
        <button class="session-chip" type="button" data-action="session" aria-label="Oturumu değiştir" id="session-chip"></button>
        <button class="icon-btn topbar-theme" type="button" data-action="theme" aria-label="Temayı değiştir"><span data-theme-icon></span></button>
      </header>
      <div class="view" id="view" aria-live="polite"></div>
    </main>

    <nav class="bottom-nav" id="nav-bottom" aria-label="Alt menü"></nav>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
